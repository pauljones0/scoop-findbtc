name: checkver

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm get.scoop.sh | iex
      - name: Run checkver
        shell: pwsh
        run: |
          & "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1" findbtc -Dir "$env:GITHUB_WORKSPACE\bucket" -Update -SkipUpdated
      - name: Commit updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/
          git diff --cached --quiet && echo 'checkver: already current' || { git commit -m 'checkver: bump manifests' && git push; }
